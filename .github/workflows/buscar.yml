name: Buscar ofertas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13,17,21,1 * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar JobBot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOBBOT_MIN_SCORE: "50"
          JOBBOT_MAX_LINKS_PER_SEARCH: "15"
          JOBBOT_MAX_TELEGRAM_RESULTS: "8"
          JOBBOT_FORCE_SHOW: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          JOBBOT_NOTIFY_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python main.py

      - name: Guardar historial de ofertas vistas
        run: |
          if git diff --quiet -- seen_jobs.json; then
            echo "Sin cambios en seen_jobs.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git commit -m "Update seen jobs"
          git push
